name: Smoke test
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Nuvio runtime libraries
        run: |
          cd tools/nuvio && npm install --no-audit --no-fund --silent
          mkdir -p ../../app/src/main/assets/nuvio
          npx esbuild entry.js --bundle --minify --platform=browser --format=iife --outfile=../../app/src/main/assets/nuvio/libs.js
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: gradle assemblePhoneDebug --no-daemon -q
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator and collect the crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/phone/debug/*.apk
            adb logcat -c
            adb shell am start -n com.example.xstream/com.example.streamnest.MainActivity
            sleep 25
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d | grep -E "AndroidRuntime|FATAL|Exception|Caused by|at com\.|at androidx\.|at kotlin" | head -120 > logcat.txt || true
            echo "---- crash buffer"; cat crash.txt | head -80
            echo "---- logcat"; cat logcat.txt | head -80
            msg=$( (cat crash.txt; echo ----; cat logcat.txt) | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::warning title=Smoke::$msg"
