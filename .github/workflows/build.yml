name: Build APK
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the APK as a release (off = only check that it builds)"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Nuvio runtime libraries (cheerio, crypto-js)
        run: |
          cd tools/nuvio && npm install --no-audit --no-fund --silent
          mkdir -p ../../app/src/main/assets/nuvio
          npx esbuild entry.js --bundle --minify --platform=browser --format=iife --outfile=../../app/src/main/assets/nuvio/libs.js
          ls -la ../../app/src/main/assets/nuvio
      - name: Build
        run: |
          set -o pipefail
          mkdir -p out
          # 0.9.6: the 64-bit APK (Xstream's default) ...
          gradle assemblePhoneDebug --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/phone/debug/*.apk out/Xstream-phone.apk
          # ... then the same code with the 32-bit ABI only (same key, same versionCode).
          gradle assemblePhoneDebug -PphoneAbi=arm32 --no-daemon 2>&1 | tee -a build.log
          cp app/build/outputs/apk/phone/debug/*.apk out/Xstream-phone-arm32.apk
          ls -la out/
      - name: Check the APKs
        run: |
          for a in out/*.apk; do
            n=$(basename "$a"); sz=$(du -m "$a" | cut -f1)
                        libs=$(unzip -l "$a" | grep "lib/" | awk '{print $1, $4}' | sort -rn | head -8 | awk '{printf "%s %.1fMB; ", $2, $1/1048576}')
            echo "::notice title=$n ($sz MB)::$libs"
            # 0.9.6: the slimmed-out libraries must really be gone (a Feature switch must never meet a missing .so).
            if unzip -l "$a" | grep -E "lib/.*(libvlc|libvosk|libjnidispatch|libjingle)"; then
              echo "::error title=$n::a slimmed-out native library is still in the APK"; exit 1
            fi
            b=$(stat -c%s "$a")
            if [ "$b" -gt $((45*1024*1024)) ]; then echo "::warning title=$n::bigger than 45 MB ($((b/1048576)) MB)"; fi
          done
          # 0.9.6: one ABI per APK.
          if unzip -l out/Xstream-phone.apk | grep -q "lib/armeabi-v7a/"; then echo "::error::the arm64 APK holds 32-bit libraries"; exit 1; fi
          if unzip -l out/Xstream-phone-arm32.apk | grep -q "lib/arm64-v8a/"; then echo "::error::the arm32 APK holds 64-bit libraries"; exit 1; fi
      - name: WebRTC library for Watch together (assets branch + checksum)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/webrtc-assets.sh "${{ github.repository }}" ${{ inputs.publish && 'strict' || '' }}
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Could not (find|resolve)|> " build.log | grep -v "^> Task" | head -60 > errs.txt || true
          sed -i 's/%/%25/g' errs.txt
          for chunk in 0 20 40; do
            msg=$(sed -n "$((chunk+1)),$((chunk+20))p" errs.txt | awk 'BEGIN{ORS="%0A"}{print}')
            [ -n "$msg" ] && echo "::error title=Build errors $chunk::$msg"
          done
          true
      - name: CloudStream plugin compatibility check
        if: success()
        continue-on-error: true
        run: |
          mkdir -p cscheck && cd cscheck
          for u in \
            "https://raw.githubusercontent.com/phisher98/cloudstream-extensions-phisher/builds/FourKHDHub.cs3" \
            "https://raw.githubusercontent.com/phisher98/cloudstream-extensions-phisher/builds/HDhub4u.cs3" \
            "https://raw.githubusercontent.com/phisher98/cloudstream-extensions-phisher/builds/MPlayerProvider.cs3" \
            "https://raw.githubusercontent.com/phisher98/cloudstream-extensions-phisher/builds/UHDmoviesProvider.cs3" \
            "https://raw.githubusercontent.com/SaurabhKaperwan/CSX/builds/VegaMovies.cs3" \
            "https://raw.githubusercontent.com/NivinCNC/CNCVerse-Cloud-Stream-Extension/builds/CNC%20Verse.cs3" \
            "https://raw.githubusercontent.com/NivinCNC/CNCVerse-Cloud-Stream-Extension/builds/CNC%20Verse%20Mobile.cs3"; do
            curl -sL -o "$(basename "$u" | sed 's/%20/_/g')" "$u"
          done
          cd ..
          python3 tools/cs_compat.py out/Xstream-phone.apk cscheck/*.cs3 | tee cscheck.txt
          msg=$(head -40 cscheck.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::warning title=CloudStream compatibility::$msg"
      - uses: actions/upload-artifact@v4
        with:
          name: Xstream-phone-apk
          path: out/*.apk
      - name: Prepare release files
        if: ${{ inputs.publish }}
        run: |
          mkdir -p release
          cp out/Xstream-phone.apk release/Xstream-phone.apk
          cp out/Xstream-phone-arm32.apk release/Xstream-phone-arm32.apk
          G=app/build.gradle.kts
          CODE=$(grep 'versionCode = ' $G | sed -n 1p | grep -o '[0-9]\+')
          NAME=$(grep 'versionName = ' $G | sed -n 1p | sed 's/.*"\(.*\)".*/\1/')
          MIN=$(cat min-version.txt 2>/dev/null | grep -o '[0-9]\+' | head -1); MIN=${MIN:-0}
          echo "{\"phone\":$CODE,\"tv\":0,\"phoneName\":\"$NAME\",\"tvName\":\"\",\"tag\":\"build-${{ github.run_number }}\",\"minPhone\":$MIN}" > release/versions.json
          cat release/versions.json
          echo "TAG=build-${{ github.run_number }}" >> $GITHUB_ENV
          echo "TITLE=Xstream $NAME" >> $GITHUB_ENV
          cp RELEASE_NOTES.md release/notes.md
      - uses: softprops/action-gh-release@v2
        if: ${{ inputs.publish }}
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TITLE }}
          body_path: release/notes.md
          make_latest: true
          files: |
            release/Xstream-phone.apk
            release/Xstream-phone-arm32.apk
            release/versions.json
            release/notes.md
